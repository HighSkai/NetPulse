{% from "_macros.html" import device_fields %}
<form id="add-device" class="device-form" method="post" action="{{ url_for('netpulse.add_device') }}"
      hx-post="{{ url_for('netpulse.add_device') }}" hx-target="this" hx-swap="outerHTML"
      hx-disabled-elt="find button" hx-include="#device-filter">
  {{ device_fields(form) }}
  <button type="submit" class="primary">Add device</button>
</form>
