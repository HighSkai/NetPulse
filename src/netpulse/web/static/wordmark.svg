<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 120" width="375" height="120" role="img" aria-label="netpulse">
  <title>netpulse</title>
  <style>
    svg { --logo-body: #dfe6ee; --logo-leg: #8792ff; --logo-joint: #7fd4f0; --logo-pulse: #48e8f8; --rule: #262d3b; }
    @media (prefers-color-scheme: light) { svg { --logo-body: #0b0f16; --logo-leg: #4b55ff; --logo-joint: #0b6a85; --logo-pulse: #0b6a85; --rule: #d5dbe4; } }
    .body { fill: none; stroke: var(--logo-body); }
    .leg { fill: none; stroke: var(--logo-leg); }
    .joint { fill: none; stroke: var(--logo-joint); }
    .pulse { fill: none; stroke: var(--logo-pulse); }
    .eye { fill: var(--logo-pulse); }
    .grid { fill: var(--rule); }
  </style>
  <defs>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle class="grid" cx="0" cy="0" r="1.5"/>
      <circle class="grid" cx="15" cy="0" r="1.5"/>
      <circle class="grid" cx="0" cy="15" r="1.5"/>
      <circle class="grid" cx="15" cy="15" r="1.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)"/>
  <!-- "net" in the body colour, "pulse" in the pulse colour. -->
  <g stroke-width="4" stroke-linejoin="miter" stroke-linecap="square">
    <polyline class="body" points="15,75 15,45 45,45 45,75"/>
    <polyline class="body" points="90,75 60,75 60,45 90,45 90,60 60,60"/>
    <polyline class="body" points="120,15 120,75 135,75"/>
    <polyline class="body" points="105,45 135,45"/>
    <polyline class="pulse" points="150,105 150,45 180,45 180,75 150,75"/>
    <polyline class="pulse" points="195,45 195,75 225,75 225,45"/>
    <polyline class="pulse" points="240,15 255,15 255,75 270,75"/>
    <polyline class="pulse" points="315,45 285,45 285,60 315,60 315,75 285,75"/>
    <polyline class="pulse" points="360,75 330,75 330,45 360,45 360,60 330,60"/>
  </g>
</svg>
