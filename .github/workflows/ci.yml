# Checks every push and pull request without the test suite, which is kept out
# of this repository: install NetPulse from source, lint it with ruff, and
# render every page once with NetPulse's built-in fake pinger and network
# reader. Nothing here pings, captures or contacts a third-party service.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the supported platform: oldest and newest Python.
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.14" }
          # The web app and its fakes must not depend on Windows.
          - { os: ubuntu-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install . "ruff>=0.15"
      - name: Lint
        run: python -m ruff check src
      - name: Command line
        run: netpulse --help
      - name: Render every page
        shell: python
        run: |
          import tempfile
          from pathlib import Path

          from netpulse.netinfo.fake import FakeNetworkReader
          from netpulse.ping.fake import FakePinger
          from netpulse.store import Store
          from netpulse.web import create_app

          db = Path(tempfile.mkdtemp()) / "ci.db"
          app = create_app(db_path=db, pinger=FakePinger(), network=FakeNetworkReader())
          Store.open(db).add_device("Router", "192.168.1.1")
          client = app.test_client()
          pages = [
              "/", "/devices", "/devices/1", "/devices/1?range=30d", "/devices/1/edit",
              "/settings", "/status", "/network", "/map", "/map/view", "/discover",
              "/probe", "/probe/outside", "/traffic", "/static/style.css",
          ]
          failed = []
          for page in pages:
              status = client.get(page, headers={"Host": "127.0.0.1"}).status_code
              print(status, page)
              if status != 200:
                  failed.append(page)
          assert client.get("/no-such-page", headers={"Host": "127.0.0.1"}).status_code == 404
          assert client.get("/", headers={"Host": "attacker.example"}).status_code == 400
          assert not failed, f"pages that did not render: {failed}"
